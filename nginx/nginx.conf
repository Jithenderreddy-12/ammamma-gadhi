# Ammamma Gadhi — Nginx reverse proxy + load balancer.
#
# Traffic flow: customer -> this Nginx (port 80) -> api1 / api2 (port 3000)
# -> Postgres. The API servers are stateless (all state lives in the
# database), so any request can go to either replica.
#
# Load-balancing policy: least_conn — each request goes to the replica with
# the fewest active connections. That beats round-robin when requests take
# different amounts of time (a checkout with a Razorpay call is slower than
# a catalogue read), because a busy replica stops receiving new work.
#
# Health: open-source Nginx has no *active* health checks (that is an
# Nginx Plus feature). Instead this uses passive checks: if a replica
# fails 3 times within 10s (max_fails / fail_timeout) Nginx marks it down
# and stops sending it traffic until it recovers. `proxy_next_upstream`
# retries a failed request on the other replica. The api containers also
# have a Docker HEALTHCHECK, and docker-compose only starts Nginx once
# both replicas report healthy.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    upstream ammamma_api {
        least_conn;
        server api1:3000 max_fails=3 fail_timeout=10s;
        server api2:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Orders carry a JSON body; 1 MB is far above any real checkout.
        client_max_body_size 1m;

        # Health endpoint for uptime checks — no access-log spam.
        location = /health {
            access_log off;
            proxy_pass http://ammamma_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://ammamma_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward the real client, not Nginx's own address, so the API
            # logs (and any future rate limiting) see the true caller.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;

            # If a replica errors or times out, retry once on the other one.
            # Safe here because order creation is idempotent when the client
            # sends an Idempotency-Key (see ARCHITECTURE.md).
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
